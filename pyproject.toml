[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sppyte"
dynamic = ["version"]
description = 'Common tasks with SharePoint REST service'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["sharepoint", "sharepoint-rest", "odata", "ntlm", "kerberos", "negotiate", "on-premise"]
authors = [{ name = "B-Jones-RFD" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["requests>=2.28", "pyspnego>=0.9", "cryptography>=41"]

[project.optional-dependencies]
# Kerberos on Linux/macOS needs the system GSSAPI libraries plus these bindings.
kerberos = ["pyspnego[kerberos]"]

[project.urls]
Documentation = "https://b-jones-rfd.github.io/sppyte/"
Changelog = "https://github.com/B-Jones-RFD/sppyte/blob/main/CHANGELOG.md"
Issues = "https://github.com/B-Jones-RFD/sppyte/issues"
Source = "https://github.com/B-Jones-RFD/sppyte"

[tool.hatch.version]
path = "src/sppyte/__about__.py"

[tool.hatch.envs.hatch-test]
extra-dependencies = ["responses>=0.25"]

[tool.hatch.envs.hatch-static-analysis]
# Hatch writes its default ruff rules to this file (`hatch fmt --sync`); committing it
# keeps local `hatch fmt` and CI on the same rule set regardless of hatch/ruff version.
config-path = "ruff_defaults.toml"
# Must match the ruff the defaults were generated for. To upgrade: bump hatch,
# run `hatch fmt --sync`, then update this pin to `hatch run hatch-static-analysis:ruff --version`.
dependencies = ["ruff==0.4.5"]

[tool.ruff]
extend = "ruff_defaults.toml"

[tool.ruff.lint]
# Docstrings: Google style (PEP 257 compliant), on top of hatch's defaults.
extend-select = ["D"]
extend-ignore = [
  "D105", # magic methods need no docstring
  "D107", # __init__ is documented in the class docstring (Args:)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["D"]

[tool.hatch.envs.docs]
dependencies = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
[tool.hatch.envs.docs.scripts]
build = "mkdocs build --strict"
serve = "mkdocs serve"

[tool.hatch.envs.types]
extra-dependencies = ["mypy>=1.0.0"]
[tool.hatch.envs.types.scripts]
check = "mypy --ignore-missing-imports --install-types --non-interactive {args:src/sppyte tests}"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "sppyte.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = false

[tool.coverage.run]
source_pkgs = ["sppyte", "tests"]
branch = true
parallel = true
omit = ["src/sppyte/__about__.py"]

[tool.coverage.paths]
sppyte = ["src/sppyte", "*/sppyte/src/sppyte"]
tests = ["tests", "*/sppyte/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:sppyte"]
