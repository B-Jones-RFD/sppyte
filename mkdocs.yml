site_name: sppyte
site_description: A tiny, explicit Python helper for SharePoint on-premises REST with NTLM.
site_url: https://b-jones-rfd.github.io/sppyte/
repo_url: https://github.com/B-Jones-RFD/sppyte
repo_name: B-Jones-RFD/sppyte
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Guide: guide.md
  - API reference:
      - Site: api/site.md
      - Authentication: api/auth.md
      - List: api/lists.md
      - Library: api/libraries.md
      - Batch: api/batch.md
      - Errors: api/errors.md
      - Retry: api/retry.md
      - OData and parsing: api/odata.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
